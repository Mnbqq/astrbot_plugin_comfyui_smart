name: Release

on:
  push:
    tags: ["v*"]
  # 手动重建：**tag 推送用的是「该 tag 提交里」的 workflow**，
  # 所以改完发版流程之后，已经存在的旧 tag 只能靠这里手动重跑
  # （Actions → Release → Run workflow，填 tag 名）。
  # 顺带也是「一次推多个 tag 不触发工作流」那个坑的兜底。
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布 / 重建的 tag，例如 v0.29.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 打包并发布 Release
    runs-on: ubuntu-latest
    env:
      # tag 推送时用 ref_name；手动触发时用输入的那个 tag
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # 刻意**检出 main，而不是触发这次运行的 tag**：
      #   1. Release 正文取自 docs/CHANGELOG.md，而 v0.17.0~v0.29.0 的条目是后来
      #      才补进 main 的 —— 那些 tag 当时的提交里根本没有对应段落（这正是
      #      CHANGELOG 断档那件事），在 tag 上检出只会抽到「没有条目」的兜底文案；
      #   2. 抽取脚本 .github/scripts/release_notes.py 同样是后加的，旧 tag 里没有。
      # 源码包不受影响：它用 `git archive <tag>` 单独从 tag 取，与工作区无关。
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0        # 需要完整 tag 列表来拼 Full Changelog 链接
          fetch-tags: true      # 检出 main 时默认不带 tag，必须显式打开

      # tag 推送会**同时**触发 CI 与 Release，两条流水线并行 ——
      # 这次就出现了「CI 判红、Release 已经把包发出去了」。
      # 发布比 CI 更有破坏力（市场会拉这个包），所以它必须自己把关。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 发布前跑测试（CI 并行，不能指望它）
        run: |
          set -euo pipefail
          pip install -q -r requirements.txt
          python3 tests/test_logic.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 发布前跑前端测试
        run: node tests/test_pages_js.js

      - name: 构建源码包（与仓库快照同名）
        run: |
          set -euo pipefail
          # 包内**顶层目录必须就叫插件名**：AstrBot 按插件目录名找
          # data/config/<插件名>_config.json，目录名带版本号会让它认为这是另一个插件，
          # 表现为「更新后配置没了」（1.1.0 真踩到了）。
          # 资产名可以带版本，包内目录不行。
          PKG="astrbot_plugin_comfyui_smart"
          NAME="${PKG}_${TAG}"
          # tag 没取到就立刻失败，别产出一个内容不对的包
          git rev-parse --verify "refs/tags/${TAG}" >/dev/null
          mkdir -p "dist/${PKG}"
          git archive "${TAG}" | tar -x -C "dist/${PKG}"
          (cd dist && tar -czf "${NAME}.tar.gz" "${PKG}")
          ls -la dist
          # 自检：包内顶层目录必须正好是插件名，否则直接失败，别发出装不上的包
          # 注意不能用 `| head -1`：set -o pipefail 下 head 提前关闭管道，
          # tar 会收到 SIGPIPE 返回 141，整条流水线判失败（v1.1.1 第一版就这么挂的）。
          # sed 会读完整个输入，不会有这个问题。
          TOP=$(tar tzf "dist/${NAME}.tar.gz" | sed -n '1p' | cut -d/ -f1)
          if [ "${TOP}" != "${PKG}" ]; then
            echo "::error::包内顶层目录是 ${TOP}，应为 ${PKG}；这会让 AstrBot 找不到原配置"
            exit 1
          fi
          echo "包内顶层目录：${TOP} ✅"

      # 正文直接取 CHANGELOG 里这一版那一节。
      # 为什么不用 generate_release_notes：那个「What's Changed」列表来自
      # **已合并的 PR**，本仓库直接往 main 推、不开 PR，自动生成的正文只有
      # 孤零零一行 compare 链接，等于没有说明。
      # 检出 main 是为了回填旧 tag（v0.17~v0.29 的条目是后补进 main 的），
      # 但**新发的 tag** 会遇到另一个问题：tag 推送往往早于 main 更新，
      # 这时工作区里的 CHANGELOG 还是旧的，于是抽不到本次条目，正文变成
      # 「没有该版本的条目」的兜底文案（v0.35.0 真踩到了）。
      # 所以：tag 内那份 CHANGELOG 里有这一版，就用 tag 的；没有才回退 main。
      - name: 按 tag 校对 CHANGELOG
        run: |
          set -euo pipefail
          echo "TAG=${TAG}  HEAD=$(git rev-parse --short HEAD)"
          have=$(grep -c "^\*\*${TAG}\*\*" docs/CHANGELOG.md || true)
          echo "工作区 CHANGELOG 本版条目数：${have}"
          # 先写临时文件再判断：直接 `git show > docs/CHANGELOG.md` 一旦失败会把文件截空，
          # 然后静默走 else —— 正文就变成「没有该版本的条目」（v0.35.0 踩过一次）。
          git show "${TAG}:docs/CHANGELOG.md" > /tmp/changelog_tag.md 2>/tmp/show_err.txt || true
          if [ -s /tmp/changelog_tag.md ] && grep -q "^\*\*${TAG}\*\*" /tmp/changelog_tag.md; then
            cp /tmp/changelog_tag.md docs/CHANGELOG.md
            echo "使用 tag 内的 CHANGELOG"
          else
            echo "tag 内没有本版条目或读取失败，沿用 main 的 CHANGELOG"
            cat /tmp/show_err.txt 2>/dev/null || true
          fi
          # 最终仍没有条目，说明正文注定是兜底文案 —— 直接失败，不发布坏正文
          grep -q "^\*\*${TAG}\*\*" docs/CHANGELOG.md || {
            echo "::error::CHANGELOG 里没有 ${TAG} 的条目，拒绝生成空正文"; exit 1; }
      - name: 从 CHANGELOG 生成 Release 正文
        run: python3 .github/scripts/release_notes.py "${TAG}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          body_path: release_body.md
          generate_release_notes: false
          files: dist/*.tar.gz
          draft: false
