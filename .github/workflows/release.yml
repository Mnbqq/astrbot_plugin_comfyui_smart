name: Release

on:
  push:
    tags: ["v*"]
  # 手动重建：**tag 推送用的是「该 tag 提交里」的 workflow**，
  # 所以改完发版流程之后，已经存在的旧 tag 只能靠这里手动重跑
  # （Actions → Release → Run workflow，填 tag 名）。
  # 顺带也是「一次推多个 tag 不触发工作流」那个坑的兜底。
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布 / 重建的 tag，例如 v0.29.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 打包并发布 Release
    runs-on: ubuntu-latest
    env:
      # tag 推送时用 ref_name；手动触发时用输入的那个 tag
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # 刻意**检出 main，而不是触发这次运行的 tag**：
      #   1. Release 正文取自 docs/CHANGELOG.md，而 v0.17.0~v0.29.0 的条目是后来
      #      才补进 main 的 —— 那些 tag 当时的提交里根本没有对应段落（这正是
      #      CHANGELOG 断档那件事），在 tag 上检出只会抽到「没有条目」的兜底文案；
      #   2. 抽取脚本 .github/scripts/release_notes.py 同样是后加的，旧 tag 里没有。
      # 源码包不受影响：它用 `git archive <tag>` 单独从 tag 取，与工作区无关。
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0        # 需要完整 tag 列表来拼 Full Changelog 链接
          fetch-tags: true      # 检出 main 时默认不带 tag，必须显式打开

      - name: 构建源码包（与仓库快照同名）
        run: |
          set -euo pipefail
          NAME="astrbot_plugin_comfyui_smart_${TAG}"
          # tag 没取到就立刻失败，别产出一个内容不对的包
          git rev-parse --verify "refs/tags/${TAG}" >/dev/null
          mkdir -p "dist/${NAME}"
          git archive "${TAG}" | tar -x -C "dist/${NAME}"
          (cd dist && tar -czf "${NAME}.tar.gz" "${NAME}")
          ls -la dist

      # 正文直接取 CHANGELOG 里这一版那一节。
      # 为什么不用 generate_release_notes：那个「What's Changed」列表来自
      # **已合并的 PR**，本仓库直接往 main 推、不开 PR，自动生成的正文只有
      # 孤零零一行 compare 链接，等于没有说明。
      - name: 从 CHANGELOG 生成 Release 正文
        run: python3 .github/scripts/release_notes.py "${TAG}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          body_path: release_body.md
          generate_release_notes: false
          files: dist/*.tar.gz
          draft: false
