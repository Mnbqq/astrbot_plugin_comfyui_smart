name: astrbot_plugin_comfyui_smart
display_name: ComfyUI 智能绘图
short_desc: 一句话中文出图，自动选模型、自动配工作流
desc: >-
  将 AstrBot 连接到 ComfyUI：一句中文描述即可出图。插件会识别你 ComfyUI 里真实的模型与节点能力，
  自动选择 Checkpoint / LoRA / VAE，并为 SD1.5 / SDXL / Pony / Flux 等不同架构匹配正确的工作流模板、
  分辨率与采样参数。支持自定义 API 格式工作流模板、权限与配额控制、出图统计与画廊。
version: "0.3.7"
author: Mnbqq
repo: "https://github.com/Mnbqq/astrbot_plugin_comfyui_smart"
# 下界由 tests/check_api_surface.py 实测确定：
#   astrbot.api.web（json_response/file_response/request）自 v4.26.0 起提供
#   AstrBotConfig.save_config_async 自 v4.27.0 起提供（更早版本自动回退到 save_config）
#   Star.logger 自 v4.27.3 起提供（更早版本自动回退到全局 logger）
astrbot_version: ">=4.26.0"
support_platforms:
  - aiocqhttp
  - qq_official
  - telegram
  - discord
help: 安装后只需在配置页填写 ComfyUI 地址。聊天中发送 /画图 <描述> 出图，/模型列表 查看可用模型，/帮助 查看全部指令。
tags:
  - 画图
  - comfyui
  - AI绘画
