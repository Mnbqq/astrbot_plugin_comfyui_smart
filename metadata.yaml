name: astrbot_plugin_comfyui_smart
display_name: ComfyUI 智能绘图
short_desc: 一句话中文出图，自动选模型、自动配工作流
desc: >-
  将 AstrBot 连接到 ComfyUI：一句中文描述即可出图。插件会识别你 ComfyUI 里真实的模型与节点能力，
  自动选择 Checkpoint / LoRA / VAE，并为 SD1.5 / SDXL / Pony / Flux 等不同架构匹配正确的工作流模板、
  分辨率与采样参数。支持图生图、扩图（outpaint）、局部重绘（配置页涂抹遮罩）与看图反推提示词，多个 ComfyUI 时按负载自动分配并熔断故障节点，出图时通过 WebSocket 推送实时进度
  并可用 /取消 中止，支持文生视频与图生视频（含 GGUF 量化，8G 显存可跑），界面与提示词中英双语；多人同时使用时有并发闸门与排队，多个 ComfyUI 时按负载自动分配；界面格式工作流可直接导入。
  支持自定义 API 格式工作流模板、权限与配额控制、出图统计与画廊。
version: "0.19.0"
author: Mnbqq
repo: "https://github.com/Mnbqq/astrbot_plugin_comfyui_smart"
astrbot_version: ">=4.26.0"
support_platforms:
  - aiocqhttp
  - qq_official
help: 安装后只需在配置页填写 ComfyUI 地址。聊天中发送 /画图 <描述> 出图，/取消 中止当前出图，/模型列表 查看可用模型，/帮助 查看全部指令。
tags:
  - 画图
  - comfyui
  - AI绘画
